[package]
name = "battery-agent"
version = "0.1.0"
edition = "2024"
description = "macOS LaunchDaemon that reports battery health to BatteryStatServer"

[dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
plist = "1"
battery-model = { path = "../model" }
serde = "1"
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json", "native-tls"] }
native-tls = "0.2"

[profile.release]
strip = true
lto = true
