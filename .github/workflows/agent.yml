name: macOS agent

on:
  push:
    branches: [main]
    tags: ['agent-v*']
    paths: ['agent/**', 'model/**', '.github/workflows/agent.yml']
  pull_request:
    paths: ['agent/**', 'model/**', '.github/workflows/agent.yml']

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: aarch64-apple-darwin,x86_64-apple-darwin
          cache-workspaces: agent
      - name: Test
        working-directory: agent
        run: cargo test
      - name: Build dmg
        working-directory: agent
        run: |
          if [[ "$GITHUB_REF" == refs/tags/agent-v* ]]; then export VERSION="${GITHUB_REF#refs/tags/agent-v}"; fi
          ./packaging/build-dmg.sh
      - name: Smoke test
        working-directory: agent
        # GitHub's macOS runners are VMs with no battery, so only check it fails cleanly.
        run: target/pkgroot/usr/local/libexec/battery-agent --dry-run || test $? -eq 1
      - uses: actions/upload-artifact@v7
        with:
          name: battery-agent-dmg
          path: agent/target/*.dmg
      - name: Release
        if: startsWith(github.ref, 'refs/tags/agent-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" agent/target/*.dmg --title "battery-agent ${GITHUB_REF_NAME#agent-v}" --generate-notes
