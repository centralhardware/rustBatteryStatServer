name: macOS agent

on:
  push:
    branches: [main]
    tags: ['agent-v*']
    paths: ['agent/**', 'model/**', '.github/workflows/agent.yml']
  pull_request:
    paths: ['agent/**', 'model/**', '.github/workflows/agent.yml']

permissions:
  contents: write
  pull-requests: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: aarch64-apple-darwin,x86_64-apple-darwin
          cache-workspaces: agent
      - name: Test
        working-directory: agent
        run: cargo test
      - name: Build dmg
        working-directory: agent
        run: |
          if [[ "$GITHUB_REF" == refs/tags/agent-v* ]]; then export VERSION="${GITHUB_REF#refs/tags/agent-v}"; fi
          ./packaging/build-dmg.sh
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      - name: Smoke test
        working-directory: agent
        # GitHub's macOS runners are VMs with no battery, so only check it fails cleanly.
        run: target/pkgroot/usr/local/libexec/battery-agent --dry-run || test $? -eq 1
      - uses: actions/upload-artifact@v7
        with:
          name: battery-agent-dmg
          path: agent/target/*.dmg
      - name: Release
        if: startsWith(github.ref, 'refs/tags/agent-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" agent/target/*.dmg --title "battery-agent ${GITHUB_REF_NAME#agent-v}" --generate-notes
      # main is protected, so the cask bump goes through a PR.
      - name: Bump Homebrew cask
        if: startsWith(github.ref, 'refs/tags/agent-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#agent-v}"
          SHA=$(shasum -a 256 "agent/target/battery-agent-$VERSION.dmg" | cut -d' ' -f1)
          git fetch origin main && git checkout -B "cask-$VERSION" origin/main
          sed -i '' -e "s/^  version \".*\"/  version \"$VERSION\"/" -e "s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/battery-agent.rb
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -am "Cask: battery-agent $VERSION"
          git push -f origin "cask-$VERSION"
          gh pr create --base main --head "cask-$VERSION" --title "Cask: battery-agent $VERSION" --body "Bumps the Homebrew cask to the $GITHUB_REF_NAME release."
